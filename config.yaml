audio:
  # "system_audio" → native macOS Core Audio Process Tap (macOS 14.2+).
  # Falls back to BlackHole 2ch automatically if the OS / helper is unavailable
  # or the user denies Audio Capture permission. To force the legacy BlackHole
  # path explicitly (e.g. for Multi-Output Device setups), set "BlackHole 2ch".
  device: "system_audio"
  chunk_duration: 30           # seconds per WAV chunk on disk
  sample_rate: 16000
  channels: 1

notes:
  update_interval: 900         # seconds between mid-session note refreshes (default 15 min)

output:
  directory: "./sessions"
  tmp_directory: "./tmp"
  auto_delete_audio: true

server:
  host: "127.0.0.1"
  port: 8000
